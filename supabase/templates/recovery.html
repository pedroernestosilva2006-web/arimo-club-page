<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefina sua senha ARIMO</title>
  </head>
  <body style="margin: 0; background: #050505; color: #f5f5f3; font-family: Arial, sans-serif">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #050505"
    >
      <tr>
        <td align="center" style="padding: 56px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 560px; border-top: 1px solid #2a2a2a"
          >
            <tr>
              <td
                style="padding: 36px 0 20px; font-size: 11px; letter-spacing: 4px; color: #8f8f8f"
              >
                ARIMO CLUB
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 0; font-size: 38px; line-height: 1.08; font-weight: 500">
                Proteja seu acesso.
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 0 30px; font-size: 16px; line-height: 1.65; color: #a0a0a0">
                Recebemos uma solicitação para redefinir sua senha. O link abaixo é de uso único.
              </td>
            </tr>
            <tr>
              <td style="padding: 0 0 38px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #f5f5f3;
                    color: #080808;
                    padding: 17px 24px;
                    text-decoration: none;
                    font-size: 11px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                  "
                  >Definir nova senha</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  border-top: 1px solid #242424;
                  padding: 24px 0;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #666;
                "
              >
                Ignore este e-mail caso você não tenha solicitado a alteração.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
